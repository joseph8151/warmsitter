<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · warm sitter</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, #e0f2fe 0%, #f0f9ff 60%, #fff 100%);
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e0f2fe;
        border-radius: 20px;
        box-shadow: 0 4px 24px -6px rgba(2, 132, 199, 0.18);
        padding: 40px 28px;
        max-width: 360px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(180deg, #0b1220 0%, #0f172a 60%, #020617 100%);
          color: #e2e8f0;
        }
        .card { background: #0f172a; border-color: #1e293b; }
        h1 { color: #7dd3fc !important; }
      }
      .sun { font-size: 48px; }
      h1 { color: #0369a1; font-size: 20px; margin: 12px 0 6px; }
      p { color: #64748b; font-size: 14px; margin: 0 0 20px; }
      button {
        background: #0ea5e9;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="sun">☀️</div>
      <h1>지금은 오프라인이에요</h1>
      <p>인터넷 연결을 확인한 뒤 다시 시도해주세요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
